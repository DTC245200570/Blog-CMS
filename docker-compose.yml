services:
  # ----------------------------------------------------------------------------
  # 1. Cơ sở dữ liệu MySQL
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: cms_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Vui long cau hinh MYSQL_ROOT_PASSWORD trong .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog_db}
      MYSQL_USER: ${MYSQL_USER:-blog_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Vui long cau hinh MYSQL_PASSWORD trong .env}
      MYSQL_EXPORTER_USER: ${MYSQL_EXPORTER_USER:-exporter}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?Vui long cau hinh MYSQL_EXPORTER_PASSWORD trong .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    # Dung expose thay vi ports de khong mo cong 3306 ra ngoai host (bao mat CSDL)
    expose:
      - "3306"
    networks:
      - backend_net # Chi nam trong mang noi bo backend
    deploy:
      resources:
        limits: # Gioi han tai nguyen de tranh tran bo nho
          cpus: '1.0'
          memory: 512M
    healthcheck: # Kiem tra MySQL san sang truoc khi cho WordPress ket noi
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Ứng dụng Web WordPress (Blog / CMS)
  # ----------------------------------------------------------------------------
  wordpress:
    image: wordpress:latest
    container_name: cms_wordpress
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy # Cho MySQL chay xong moi khoi dong WordPress
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-0}
      WORDPRESS_CONFIG_EXTRA: |
        define('FORCE_SSL_ADMIN', true);
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wordpress_data:/var/www/html
    expose:
      - "80"
    networks:
      # Nam o ca 2 mang: frontend_net de Nginx goi vao, backend_net de ket noi MySQL
      - frontend_net
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ----------------------------------------------------------------------------
  # 3. Quản trị CSDL (phpMyAdmin)
  # ----------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: cms_phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: ${PMA_ABSOLUTE_URI:-https://localhost/pma/}
      UPLOAD_LIMIT: 64M
    expose:
      - "80"
    networks:
      - frontend_net
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ----------------------------------------------------------------------------
  # 4. Nginx Reverse Proxy (SSL / HTTPS)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: cms_nginx
    restart: unless-stopped
    depends_on:
      - wordpress
      - phpmyadmin
    # Xoa symlink stdout/stderr de ghi log truc tiep vao file, giup Promtail doc duoc log
    command:
      - "/bin/sh"
      - "-c"
      - "rm -f /var/log/nginx/access.log /var/log/nginx/error.log && touch /var/log/nginx/access.log /var/log/nginx/error.log && exec nginx -g 'daemon off;'"
    # Nginx la cong duy nhat mo ra ngoai may host
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx # Volume chia se file log sang cho Promtail doc
    networks:
      - frontend_net # Chi noi voi frontend, khong cho phep truc tiep vao backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ----------------------------------------------------------------------------
  # 5. cAdvisor: Giám sát tài nguyên container (CPU/RAM/Disk/Network)
  # ----------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cms_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - monitor_net # Chi nam trong mang giam sat
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ----------------------------------------------------------------------------
  # 6. MySQL Exporter: Cào metrics CSDL MySQL
  # ----------------------------------------------------------------------------
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: cms_mysql_exporter
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - "--mysqld.address=mysql:3306"
      - "--mysqld.username=${MYSQL_EXPORTER_USER:-exporter}"
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?Vui long cau hinh MYSQL_EXPORTER_PASSWORD trong .env}
    expose:
      - "9104"
    networks:
      # Ket noi MySQL o backend_net va cap metrics cho Prometheus qua monitor_net
      - backend_net
      - monitor_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ----------------------------------------------------------------------------
  # 7. Prometheus Server: Thu thập & lưu trữ metrics
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: cms_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - monitor_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ----------------------------------------------------------------------------
  # 8. Grafana: Giao diện trực quan hóa Dashboard
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: cms_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Vui long cau hinh GRAFANA_ADMIN_PASSWORD trong .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning # Tu dong nhan Data Source Prometheus va Loki
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks:
      - monitor_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ----------------------------------------------------------------------------
  # 9. Loki: Lưu trữ log tập trung
  # ----------------------------------------------------------------------------
  loki:
    image: grafana/loki:latest
    container_name: cms_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    networks:
      - monitor_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ----------------------------------------------------------------------------
  # 10. Promtail: Thu thập log Nginx và chuyển tiếp tới Loki
  # ----------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:latest
    container_name: cms_promtail
    restart: unless-stopped
    depends_on:
      - loki
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - nginx_logs:/var/log/nginx:ro # Doc file access.log va error.log tu volume chia se
    networks:
      - monitor_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

# ------------------------------------------------------------------------------
# Phân chia mạng nội bộ (Network Isolation)
# ------------------------------------------------------------------------------
networks:
  frontend_net:
    driver: bridge # Mang giua Nginx va cac web app
  backend_net:
    driver: bridge # Mang noi bo cho MySQL, khong cho phep Nginx vao truc tiep
  monitor_net:
    driver: bridge # Mang rieng cho he thong giam sat va thu thap log

# ------------------------------------------------------------------------------
# Luu tru du lieu (Persistent Volumes)
# ------------------------------------------------------------------------------
volumes:
  mysql_data:
  wordpress_data:
  nginx_logs:
  prometheus_data:
  grafana_data:
  loki_data:

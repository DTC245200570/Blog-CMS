version: '3.8'

# ==============================================================================
# HỆ THỐNG BLOG / CMS (WORDPRESS) - ĐỀ TÀI 07
# Môn: Triển khai và Quản trị Hệ thống Phần mềm
# Triển khai: Nginx Reverse Proxy, WordPress, MySQL, phpMyAdmin
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Cơ sở dữ liệu MySQL (Cách ly bảo mật - Hardening)
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: cms_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    # HARDENING: Không bind port 3306 ra host máy chủ mà chỉ mở trong mạng nội bộ
    expose:
      - "3306"
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Ứng dụng Web WordPress (Blog / CMS)
  # ----------------------------------------------------------------------------
  wordpress:
    image: wordpress:latest
    container_name: cms_wordpress
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-0}
      # Nhận diện SSL HTTPS qua Nginx Reverse Proxy
      WORDPRESS_CONFIG_EXTRA: |
        define('FORCE_SSL_ADMIN', true);
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wordpress_data:/var/www/html
    expose:
      - "80"
    networks:
      - frontend_net
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ----------------------------------------------------------------------------
  # 3. Công cụ Quản trị CSDL (phpMyAdmin)
  # ----------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: cms_phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    expose:
      - "80"
    networks:
      - frontend_net
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ----------------------------------------------------------------------------
  # 4. Nginx Reverse Proxy (Cổng giao tiếp duy nhất ra ngoài - HTTPS / SSL)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: cms_nginx
    restart: unless-stopped
    depends_on:
      - wordpress
      - phpmyadmin
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

# ==============================================================================
# MẠNG VÀ PHÂN VÙNG DỮ LIỆU (NETWORKS & VOLUMES)
# ==============================================================================
networks:
  # Mạng ngoài: Chỉ Nginx tiếp nhận request và chuyển tiếp đến WordPress / phpMyAdmin
  frontend_net:
    driver: bridge
  # Mạng nội bộ: Chỉ WordPress, phpMyAdmin và Database giao tiếp với nhau
  backend_net:
    driver: bridge

volumes:
  mysql_data:
  wordpress_data:
  nginx_logs:

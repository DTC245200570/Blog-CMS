global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Thu thập chính Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Thu thập tài nguyên các container qua cAdvisor
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Thu thập chỉ số cơ sở dữ liệu MySQL
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql-exporter:9104']

# Dinh dang log truy cap dang JSON de Promtail thu thap va Loki phan tich LogQL
log_format json_analytics escape=json '{'
    '"time_local": "$time_local",'
    '"remote_addr": "$remote_addr",'
    '"request": "$request",'
    '"status": "$status",'
    '"body_bytes_sent": "$body_bytes_sent",'
    '"request_time": "$request_time",'
    '"http_referrer": "$http_referer",'
    '"http_user_agent": "$http_user_agent"'
'}';

# Chuyen huong tu dong toan bo traffic HTTP (80) sang HTTPS (443)
server {
    listen 80;
    server_name localhost;

    location / {
        return 301 https://$host$request_uri;
    }
}

# May chu chinh phuc vu HTTPS (443)
server {
    listen 443 ssl;
    server_name localhost;

    # Duong dan chung chi SSL va khoa rieng tu tao
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Giao thuc TLS an toan
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Ghi log vao file de Promtail doc duoc
    access_log /var/log/nginx/access.log json_analytics;
    error_log /var/log/nginx/error.log warn;

    # Cac header bao mat HTTP co ban
    add_header X-Frame-Options "SAMEORIGIN" always;                        # Chong Clickjacking
    add_header X-Content-Type-Options "nosniff" always;                    # Chong MIME sniffing
    add_header X-XSS-Protection "1; mode=block" always;                   # Bat bo loc XSS trinh duyet
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;  # Kiem soat thong tin referrer
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # Ep buoc HTTPS (HSTS)

    client_max_body_size 64M;

    # Dinh tuyen toi WordPress Blog/CMS
    location / {
        proxy_pass http://wordpress:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }

    # Dinh tuyen toi phpMyAdmin quan tri co so du lieu
    location /pma/ {
        proxy_pass http://phpmyadmin:80/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        rewrite ^/pma/(.*)$ /$1 break;
    }
}
